name: theorem-lab-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python experiments/adversarial_search.py > adversarial_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-results
          path: adversarial_results.json
