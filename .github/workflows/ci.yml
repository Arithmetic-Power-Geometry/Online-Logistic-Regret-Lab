name: theorem-lab-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python experiments/adversarial_search.py > adversarial_results.json
      - run: python experiments/exact_vs_gaussian_1d.py > exact_vs_gaussian_results.json
      - run: python experiments/skew_repair_1d.py > skew_repair_results.json
      - run: python experiments/moment_compression_1d.py > moment_compression_results.json
      - run: python experiments/tail_exponent_1d.py > tail_exponent_results.json
      - run: python experiments/tail_stability_1d.py > tail_stability_results.json
      - run: python experiments/ew_saddle_proxy.py > ew_saddle_proxy_results.json
      - run: python experiments/gaussian_recursion_scaling.py > gaussian_recursion_scaling_results.json
      - run: python experiments/invariant_tail_constant.py > invariant_tail_constant_results.json
      - run: python experiments/score_calibration_1d.py > score_calibration_1d_results.json
      - run: python experiments/score_nullity_ambiguity.py > score_nullity_ambiguity_results.json
      - run: python experiments/stein_closure_growth.py > stein_closure_growth_results.json
      - run: python experiments/rational_logistic_approx.py > rational_logistic_approx_results.json
      - run: python experiments/rational_logistic_degree_scaling.py > rational_logistic_degree_scaling_results.json
      - run: python experiments/pole_geometry_scaling.py > pole_geometry_scaling_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: theorem-lab-results
          path: |
            adversarial_results.json
            exact_vs_gaussian_results.json
            skew_repair_results.json
            moment_compression_results.json
            tail_exponent_results.json
            tail_stability_results.json
            ew_saddle_proxy_results.json
            gaussian_recursion_scaling_results.json
            invariant_tail_constant_results.json
            score_calibration_1d_results.json
            score_nullity_ambiguity_results.json
            stein_closure_growth_results.json
            rational_logistic_approx_results.json
            rational_logistic_degree_scaling_results.json
            pole_geometry_scaling_results.json
